[build-system]
requires = ["setuptools>=64"]
build-backend = "setuptools.build_meta"

[project]
name = "budget-planner"
version = "0.1.0"
description = "A personal budget tracking and reporting tool"
requires-python = ">=3.10"
dependencies = [
    "stockholm",
    "python-dateutil",
    "mako",
    "openai",
    "tiktoken",
]

[project.scripts]
budget-planner = "budget_planner.__main__:main"
